name: Keep demo awake

# Streamlit Community Cloud puts apps to sleep after 12 hours without visitors.
# GitHub can delay scheduled runs, so run well inside that window.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/keep_alive.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-failure
          path: keep_alive_failure.png
